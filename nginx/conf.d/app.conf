# ============================================================
# nginx/conf.d/app.conf
# Domain: vssanitation.in (GoDaddy)
# NOTE: Uses container name venkat_sai_app (not service alias
#       "app") because this nginx also serves nrms.co.in via
#       nrms.conf and is connected to both Docker networks —
#       using "app" caused DNS collision with nrm_app.
# ============================================================

# ── HTTP → HTTPS redirect ─────────────────────────────────
server {
    listen 80;
    server_name vssanitation.in www.vssanitation.in;

    # Certbot ACME challenge (required for SSL cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (SSL) ───────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name vssanitation.in www.vssanitation.in;

    # SSL certificates (generated by Certbot)
    ssl_certificate     /etc/letsencrypt/live/vssanitation.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vssanitation.in/privkey.pem;

    # Strong SSL settings
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:VSS:10m;
    ssl_session_timeout       10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static asset caching (images, css, js)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|xml|txt|svg)$ {
        proxy_pass         http://venkat_sai_app:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires            30d;
        add_header         Cache-Control "public, immutable";
        access_log         off;
    }

    # Proxy all other requests to Node.js app
    location / {
        proxy_pass         http://venkat_sai_app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
