# ============================================================
# nginx/conf.d/nrms.conf  (lives inside VenkatSaiSanitation nginx)
# Domain: nrms.co.in
#
# This nginx (venkat_sai_nginx) serves BOTH vssanitation.in
# (app.conf) and nrms.co.in (this file) because both sites
# share one VPS and only one container can own ports 80/443.
#
# venkat_sai_nginx is connected to two Docker networks:
#   • venkatsaisanitation_app_network  → venkat_sai_app
#   • nrms_nrm_network                → nrm_app
# ============================================================

# ── NRM HTTP → HTTPS redirect ────────────────────────────
server {
    listen 80;
    server_name nrms.co.in www.nrms.co.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── NRM HTTPS server ──────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name nrms.co.in www.nrms.co.in;

    ssl_certificate     /etc/letsencrypt/live/nrms.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nrms.co.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:NRM:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static Angular assets — long cache (Angular hashes filenames)
    location ~* \.(js|css|ico|woff2?|ttf|svg|png|jpg|jpeg|gif|webp)$ {
        proxy_pass http://nrm_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API routes
    location /api/ {
        proxy_pass http://nrm_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # All other requests → Angular SPA
    location / {
        proxy_pass http://nrm_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
