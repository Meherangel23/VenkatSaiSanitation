# ============================================================
# docker-compose.yml — Venkat Sai Sanitation Services
# For Hostinger VPS (with optional Nginx reverse proxy)
# ============================================================

version: "3.9"

services:

  # ── Application ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: venkat-sai-sanitation:latest
    container_name: venkat_sai_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      # Expose only internally; Nginx proxy will forward traffic
      - "127.0.0.1:3000:3000"
    networks:
      - app_network
    healthcheck:
      # curl is NOT installed in this image — use wget (available in alpine)
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx Reverse Proxy (SSL termination + static caching) ─
  nginx:
    image: nginx:1.25-alpine
    container_name: venkat_sai_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Certbot SSL certificates (mounted after cert generation)
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        # service_started (not service_healthy) — avoids deadlock if healthcheck
        # fails due to missing tool (e.g. curl not installed in image).
        condition: service_started
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Certbot (Let's Encrypt SSL — run once then comment out) ─
  certbot:
    image: certbot/certbot:latest
    container_name: venkat_sai_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Domain: vssanitation.in
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email madhursaxena@gmail.com
      --agree-tos
      --no-eff-email
      -d vssanitation.in
      -d www.vssanitation.in
    profiles:
      - ssl   # Only runs with: docker compose --profile ssl up certbot

networks:
  app_network:
    driver: bridge
